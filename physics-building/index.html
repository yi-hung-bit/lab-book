<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>物理研究院</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f3347">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="物理研究院">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script id="katex-auto" defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
/* Layout: 院區 3D 場景（左：模擬大樓、右：競賽大樓，3F 空橋相連）＋ 右側導覽面板（院區名錄／樓層教室） */
:root{
  --sky:#dfe7ec; --sky-top:#a9c8dc; --ground:#c9d1c4; --paper:#f7f6f2; --ink:#1c2228; --muted:#5b6670; --line:#cfd4d6;
  --wall:#d8cfc2; --wall-t:#cdd2d6; --slab:#eeeae2; --trim:#3a4650; --glass:#5f7a8c; --glass-lit:#ffd978;
  --plate:#1f3347; --plate-t:#2c2b45; --plate-ink:#f4f1e8; --rail:#9aa3a8;
  --lawn:#9cbf7f; --leaf:#5f8f4e; --trunk:#6b4f36; --night:0;
  --road:#6d757c; --curb:#e9ebe6; --solar:#22385a; --water:#7fb7cf;
  --f1:#3d7d4c; --f2:#c2652a; --f3:#2b64b8; --f4:#7a4fb5; --f5:#167a82; --f6:#b03a4a; --f7:#5a5f9e; --fr:#8a6a12;
  --g-kin:#2f6fa8; --g-dyn:#2b5cb8; --g-energy:#3b4fb0; --g-rot:#5a4fb5; --g-grav:#6b4aa8;
  --g-wave:#167a82; --g-fluid:#2f7d62; --g-heat:#c2652a; --g-estat:#b03a4a; --g-em:#9a3a7a;
  --g-opt:#8a6a12; --g-mod:#6a5f9e; --g-math:#4f5a63;
  --gym:#b5532e; --gym-wall:#e4ddd0; --gym-roof:#7c8d96;
  --lib:#8e2f25; --lib-wall:#efe6d2; --lib-roof:#33433d; --lib-stone:#b9b2a3;
  --db:#2a6170; --db-wall:#dfe3e5; --db-glass:#3d5866;
  --lab:#5b7f2a; --lab-wall:#e8eae3; --lab-glass:#46606e;
  --shadow:0 12px 30px rgba(28,34,40,.14);
  --f-sign:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#141b22; --sky-top:#05080d; --ground:#1f2a24; --paper:#1b2229; --ink:#e6e9ea; --muted:#9aa6ae; --line:#2f3a43;
  --wall:#4a4540; --wall-t:#3d434a; --slab:#6b6660; --trim:#11171c; --glass:#22333f; --glass-lit:#ffcf5a;
  --plate:#0f1c28; --plate-t:#1a1930; --plate-ink:#f4f1e8; --rail:#56616a;
  --lawn:#24331f; --leaf:#2e4a2a; --trunk:#3b2b1e; --night:1;
  --road:#262c31; --curb:#4a5157; --solar:#152338; --water:#24485a;
  --f1:#7cc58c; --f2:#f0a06b; --f3:#86aef2; --f4:#bc9df0; --f5:#64cbd2; --f6:#ef8d9a; --f7:#a7acee; --fr:#e3c056;
  --g-kin:#7fb4e6; --g-dyn:#86a6f2; --g-energy:#9aa2f0; --g-rot:#b0a2f0; --g-grav:#c3a2ea;
  --g-wave:#64cbd2; --g-fluid:#6fcaa6; --g-heat:#f0a06b; --g-estat:#ef8d9a; --g-em:#e693c9;
  --g-opt:#e3c056; --g-mod:#b3aeea; --g-math:#a9b4bc;
  --gym:#f08a5d; --gym-wall:#4d4842; --gym-roof:#3a464d;
  --lib:#e07a66; --lib-wall:#4a4339; --lib-roof:#24302b; --lib-stone:#5a554c;
  --db:#6cc3d4; --db-wall:#3f474d; --db-glass:#1d2b33;
  --lab:#a8d36a; --lab-wall:#454a42; --lab-glass:#1f2d35;
  --shadow:0 12px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#141b22; --sky-top:#05080d; --ground:#1f2a24; --paper:#1b2229; --ink:#e6e9ea; --muted:#9aa6ae; --line:#2f3a43;
  --wall:#4a4540; --wall-t:#3d434a; --slab:#6b6660; --trim:#11171c; --glass:#22333f; --glass-lit:#ffcf5a;
  --plate:#0f1c28; --plate-t:#1a1930; --plate-ink:#f4f1e8; --rail:#56616a;
  --lawn:#24331f; --leaf:#2e4a2a; --trunk:#3b2b1e; --night:1;
  --road:#262c31; --curb:#4a5157; --solar:#152338; --water:#24485a;
  --f1:#7cc58c; --f2:#f0a06b; --f3:#86aef2; --f4:#bc9df0; --f5:#64cbd2; --f6:#ef8d9a; --f7:#a7acee; --fr:#e3c056;
  --g-kin:#7fb4e6; --g-dyn:#86a6f2; --g-energy:#9aa2f0; --g-rot:#b0a2f0; --g-grav:#c3a2ea;
  --g-wave:#64cbd2; --g-fluid:#6fcaa6; --g-heat:#f0a06b; --g-estat:#ef8d9a; --g-em:#e693c9;
  --g-opt:#e3c056; --g-mod:#b3aeea; --g-math:#a9b4bc;
  --gym:#f08a5d; --gym-wall:#4d4842; --gym-roof:#3a464d;
  --lib:#e07a66; --lib-wall:#4a4339; --lib-roof:#24302b; --lib-stone:#5a554c;
  --db:#6cc3d4; --db-wall:#3f474d; --db-glass:#1d2b33;
  --lab:#a8d36a; --lab-wall:#454a42; --lab-glass:#1f2d35;
  --shadow:0 12px 30px rgba(0,0,0,.45); color-scheme:dark}

[hidden]{display:none!important}
body{margin:0;overflow-wrap:anywhere;background:var(--sky);color:var(--ink);font-family:var(--f-sign);font-size:15px;line-height:1.65}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
h1,h2,h3{margin:0;text-wrap:balance}
button,a{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--glass-lit);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top>div:first-child{flex:1 1 280px;min-width:0}
.top h1{font-size:clamp(28px,4.4vw,40px);font-weight:900;letter-spacing:.06em}
.top p{margin:2px 0 0;color:var(--muted)}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

.site{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:24px;align-items:start}

/* ---------- 3D campus ---------- */
.scene{position:relative;height:660px;border-radius:18px;overflow:hidden;background:linear-gradient(to bottom,var(--sky-top) 0%,var(--sky) 62%,var(--ground) 100%);box-shadow:var(--shadow);touch-action:pan-y;cursor:grab}
.scene:active{cursor:grabbing}
.scene canvas{display:block;width:100%;height:100%}
.labels{position:absolute;inset:0;pointer-events:none}
.flabel{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;border:0;background:var(--paper);color:var(--ink);border-radius:999px;padding:2px 9px 2px 3px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:background .2s,color .2s}
.flabel i{font-style:normal;font-family:var(--f-mono);font-size:11px;min-width:28px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--fc);color:var(--paper)}
.flabel.on{background:var(--fc);color:var(--paper)}
.flabel.on i{background:var(--paper);color:var(--fc)}
.flabel:hover{outline:2px solid var(--fc)}
.flabel{visibility:hidden}
.blabel{position:absolute;left:0;top:0;pointer-events:auto;border:0;cursor:pointer;background:var(--bp);color:var(--plate-ink);font-weight:900;letter-spacing:.3em;font-size:13px;padding:4px 10px 4px 14px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.2);white-space:nowrap}
.hint{position:absolute;right:14px;bottom:12px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--paper) 80%,transparent);padding:3px 10px;border-radius:999px;pointer-events:none}
.home{position:absolute;left:14px;bottom:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.nogl{padding:28px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:14px}

/* ---------- panel ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.panel-head{display:flex;align-items:center;gap:16px;padding:18px 22px;border-bottom:4px solid var(--fc,var(--plate))}
.badge{font-family:var(--f-mono);font-weight:600;font-size:24px;min-width:58px;height:58px;padding:0 6px;border-radius:10px;background:var(--fc,var(--plate));color:var(--paper);display:flex;align-items:center;justify-content:center}
.panel-head h2{font-size:23px;font-weight:900}
.panel-head p{margin:0;color:var(--muted);font-size:14px}
.panel-head .bld{font-size:12px;letter-spacing:.25em;color:var(--muted);font-weight:700}
.elevator{display:flex;gap:6px;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid var(--line);align-items:center}
.elevator .lab{font-size:12px;color:var(--muted);margin-right:4px;letter-spacing:.1em}
.ebtn{min-width:38px;height:38px;padding:0 4px;border-radius:999px;border:2px solid var(--rail);background:var(--paper);font-family:var(--f-mono);font-weight:600;font-size:12.5px;cursor:pointer}
.ebtn[aria-current="true"]{border-color:var(--glass-lit);box-shadow:0 0 0 3px color-mix(in srgb,var(--glass-lit) 45%,transparent);background:var(--plate);color:var(--plate-ink)}
.ebtn.out{border-style:dashed;font-family:var(--f-sign);font-size:12px;padding:0 10px}

.dir{padding:16px 22px 22px;display:flex;flex-direction:column;gap:18px}
.dir section{display:flex;flex-direction:column}
.dir h3{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;letter-spacing:.3em;color:var(--muted);margin-bottom:6px}
.dir h3 small{letter-spacing:.05em;font-weight:500;font-family:var(--f-mono);font-size:12px}
.dir-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;padding:7px 6px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;border-radius:6px}
.dir-row:hover{background:color-mix(in srgb,var(--paper) 85%,var(--fc))}
.dir-row .n{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--fc)}
.dir-row b{font-size:15px}
.dir-row small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.corridor{padding:20px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.room{display:flex;flex-direction:column;min-width:0}
.room .plate{background:var(--plate-t);color:var(--plate-ink);border-radius:6px 6px 0 0;padding:7px 10px 8px}
.room .plate .no{font-family:var(--f-mono);font-size:11.5px;opacity:.75;letter-spacing:.08em;display:block}
.room .plate b{font-size:14.5px;line-height:1.4;display:block}
.room .door{position:relative;border:3px solid var(--rail);border-top:0;background:color-mix(in srgb,var(--wall-t) 75%,var(--fc));min-height:70px;padding:10px;display:flex;align-items:flex-end}
.room .door::after{content:"";position:absolute;right:10px;top:40%;width:7px;height:16px;background:var(--rail);border-radius:4px}
.soon{font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.note{margin:0 22px 20px;padding:10px 14px;border-radius:8px;background:color-mix(in srgb,var(--paper) 88%,var(--fc,var(--plate)));font-size:13.5px;color:var(--ink)}
.go{display:inline-flex;align-items:center;gap:8px;margin:18px 22px 6px;padding:10px 18px;border-radius:999px;background:var(--fc,var(--plate));color:var(--paper);text-decoration:none;font-weight:700}
.go:hover{filter:brightness(1.08)}
.body-text{padding:16px 22px 4px;margin:0;font-size:14.5px}

.corridor.sim{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
button.room,a.room{border:0;background:none;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit;text-decoration:none}
.corridor.sim .room .plate{background:var(--plate)}
.corridor.sim .room .door{border-color:var(--trim);background:color-mix(in srgb,var(--wall) 70%,var(--fc));min-height:118px;flex-direction:column;align-items:stretch;gap:8px;transition:transform .2s}
.corridor.sim .room .door::after{top:16px}
.room .desc{font-size:13px;line-height:1.55;padding-right:16px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.room .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.soon.net{color:var(--f2);border-color:currentColor}
button.room:hover .door,button.room:focus-visible .door,a.room:hover .door,a.room:focus-visible .door{transform:translateY(-3px)}
.classroom{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--sky)}
.cbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--plate);color:var(--plate-ink);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cbar .back{border:1px solid color-mix(in srgb,var(--plate-ink) 40%,transparent);background:none;color:var(--plate-ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700}
.cbar .no{font-family:var(--f-mono);font-size:13px;opacity:.75}
.cbar b{font-size:18px}
.modes{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.modes button{border:1px solid color-mix(in srgb,var(--plate-ink) 40%,transparent);background:none;color:var(--plate-ink);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:14px}
.modes button[aria-pressed="true"]{background:var(--plate-ink);color:var(--plate)}
.classroom iframe{flex:1;width:100%;border:0;background:#fff;padding-bottom:env(safe-area-inset-bottom,0px)}
html.in-class,html.in-class body{overflow:hidden}
.corridor:not(.sim) .room .door{min-height:64px;align-items:center}
.room .cnt{font-size:13px;color:var(--ink)}
.room .cnt b{font-family:var(--f-mono);font-size:22px;margin-right:2px}
button.room:hover .door,button.room:focus-visible .door,a.room:hover .door,a.room:focus-visible .door{transform:translateY(-3px)}
.corridor .room .door{transition:transform .2s}
.qlist{padding:16px 22px 8px;display:flex;flex-direction:column;gap:12px}
.qyear{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start}
.qyear .yy{font-family:var(--f-mono);font-weight:600;color:var(--fc);padding-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13.5px;cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--fc);background:color-mix(in srgb,var(--paper) 85%,var(--fc))}
.empty{color:var(--muted);margin:0}
.backrow{margin:6px 22px 20px;border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font-size:14px}
.backrow:hover{color:var(--ink)}
.qview .modes button:disabled{opacity:.35;cursor:default}
.qbody{flex:1;overflow:auto;background:var(--sky);padding-block:16px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:0}
.shelves{padding:18px 22px 6px;display:grid;gap:14px}
.shelf{border:2px solid var(--fc);border-radius:10px;overflow:hidden;background:color-mix(in srgb,var(--paper) 94%,var(--fc))}
.shelf header{display:flex;align-items:baseline;gap:10px;padding:8px 14px;background:var(--fc);color:var(--paper)}
.shelf header b{font-size:16px;letter-spacing:.2em}
.shelf header span{font-size:13px;opacity:.9}
.shelf ol{list-style:none;margin:0;padding:4px 12px 8px}
.shelf li{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 2px;border-top:1px dashed var(--line)}
.shelf li:first-child{border-top:0}
.shelf .cno{color:var(--fc);font-weight:700}
.shelf .ct{font-size:14.5px}
.shelf .cp{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.shelf .ct small{display:block;font-size:11.5px;color:var(--muted)}
.shelf .cfiles{grid-column:2/-1;display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
.shelf .cfile{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.shelf .cfile em{font-style:normal;font-size:12.5px;color:var(--muted);margin-right:auto}
.shelf .cfile button{font-size:12.5px;font-weight:700;padding:3px 12px;border-radius:999px;border:1px solid var(--fc);color:var(--fc);background:var(--paper);cursor:pointer}
.shelf .cfile button.pd{background:var(--fc);color:var(--paper)}
.shelf .cfile button:disabled{opacity:.4;cursor:default}
.pvpage{position:relative;max-width:100%;background:#fff;margin:0 auto 10px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.pvpage span{position:absolute;right:8px;bottom:6px;font-family:var(--f-mono);font-size:11px;color:#888;z-index:1}
.pvpage canvas{display:block}
.pvmsg{color:var(--muted);margin:30px 0}
.shelf .cact{display:flex;gap:6px}
.shelf .cact a{font-size:12.5px;font-weight:700;text-decoration:none;padding:2px 10px;border-radius:999px;border:1px solid var(--fc);color:var(--fc)}
.shelf .cact a:last-child{background:var(--fc);color:var(--paper)}
.dbyears{padding:14px 22px 6px;display:grid;gap:8px}
.dbdec{font-size:12.5px;letter-spacing:.3em;color:var(--muted);font-weight:700;margin:8px 0 0}
.dbrow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--fc);border-radius:8px;background:color-mix(in srgb,var(--paper) 94%,var(--fc))}
.dbrow .yy{font-family:var(--f-mono);font-weight:600;font-size:17px;color:var(--fc);padding-top:3px}
.dbrow .yy small{display:block;font-family:var(--f-sign);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}
.dbfiles{display:flex;flex-direction:column;gap:5px}
.dbfile{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dbfile em{font-style:normal;font-size:13px;margin-right:auto}
.dbfile em small{color:var(--muted);font-size:12px}
.dbfile button{font-size:12.5px;font-weight:700;padding:3px 12px;border-radius:999px;border:1px solid var(--fc);color:var(--fc);background:var(--paper);cursor:pointer}
.dbfile button.pd{background:var(--fc);color:var(--paper)}
.dbfile button:disabled{opacity:.4;cursor:default}
.dbmiss{font-size:12px;color:var(--muted)}
.arcade{padding:18px 22px 6px;display:flex;flex-direction:column;gap:12px}
.game{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"no txt tag" "no txt play";gap:4px 14px;align-items:center;padding:14px 16px;border-radius:12px;border:2px solid var(--fc);background:color-mix(in srgb,var(--paper) 90%,var(--fc));text-decoration:none;color:var(--ink);transition:transform .15s}
.game:hover,.game:focus-visible{transform:translateY(-2px)}
.game .gno{grid-area:no;font-family:var(--f-mono);font-weight:600;font-size:26px;color:var(--fc)}
.game .gtxt{grid-area:txt;min-width:0}
.game .gtxt b{display:block;font-size:16px}
.game .gtxt small{display:block;color:var(--muted);font-size:13px;line-height:1.5}

    {t:"拉塞福 α 粒子散射",d:"α 粒子射向金箔：比較湯姆森葡萄乾布丁模型（只會小角度偏折）與拉塞福原子核模型（少數大角度偏折、極少數反彈）。放大單一原子調整瞄準距離 b、動能與靶原子序，看 tan(θ/2) = d/(2b) 與最接近距離；再做金箔實驗，環形偵測屏累積各角度計數，和拉塞福公式比較，由「大部分直穿、極少數反彈」推得原子核約 10⁻¹⁴ m、原子約 10⁻¹⁰ m（圖 3-5～3-7）。",sims:[["","b-rutherford"]]},
    {t:"原子核積木與夸克",d:"用質子、中子拼出原子核，即時顯示 ᴬ_Z X 標示、元素名稱與 A = Z + N，做範例 3-1 鋂-241（95 個質子、146 個中子）並練習看標示說出質子數與中子數；點一個核子放大到夸克，看質子 uud、中子 udd 的電量加總（+1 e、0）；再看弱核力造成的 β 衰變：碳-14 → 氮-14 + 電子 + 反微中子，中子裡一個 d 變成 u，以及一群自由中子以平均壽命 887 秒隨機衰變（圖 3-8、圖 3-9、圖 3-16）。",sims:[["","b-nucleus-quark"]]},
    {t:"萬有引力與重量",d:"拖曳兩個質量改變距離，看 F = Gm₁m₂/r² 的引力成對出現、大小相同方向相反，距離加倍只剩 1/4；1 公斤的蘋果移到離地心 2R_E、3R_E，g = GM_E/r² 與磅秤讀數一起變小（1 kgw → 0.25 kgw）。附範例 3-2 兩位運動員相距 1 m 的引力 6.0 × 10⁻⁷ N、範例 3-3 由 g、R、G 估算地球質量 M = gR²/G（圖 3-11、圖 3-12）。",sims:[["","b-gravity-weight"]]},
    {t:"庫侖定律與電力線",d:"擺放正負點電荷，看電力線由正電荷出發、終止於負電荷，電量加倍線數也加倍；拖曳測試電荷 +Q 看各電荷給的力與合力，即時算 F = kq₁q₂/r²（k = 8.99 × 10⁹ N·m²/C²）。再做範例 3-4：+4q 與 +9q 相距 d，找出合力為零的位置 2d/5，並和萬有引力比較同樣的平方反比、電子與質子間靜電力約是萬有引力的 2.3 × 10³⁹ 倍（圖 3-14）。",sims:[["","b-coulomb-field"]]},
    {t:"磁力線與地磁",d:"拖曳磁棒與小磁針，看磁力線的切線方向就是磁場方向：外部由 N 極到 S 極、內部由 S 極到 N 極，是不相交的封閉曲線；可灑鐵粉、擺一群小磁針，比較同極相斥與異極相吸的磁力線。再看地球像一根巨大磁棒：地理北極附近是磁 S 極、磁軸與自轉軸約夾 11°，把指南針拖到地球各處看它的指向與磁傾角（圖 3-13）。",sims:[["","b-magnetic-field"]]},
    {t:"電流磁效應與安培右手定則",d:"示範實驗 1：南北向導線通電，上方或下方的小羅盤 N 極偏東或偏西，可調電流、距離與匝數，看 tan θ = B線／B地；長直導線截面的同心圓磁力線越靠近越密，拖曳小磁針看 B ∝ I／r；環形導線與螺線管的磁力線剖面（管內均勻、管外像棒狀磁鐵），右手定則判斷 N、S 端；附範例 4-1 三條導線在 P 點的合磁場、範例 4-2 兩斜交導線四點有無磁場（圖 4-1～4-3）。",sims:[["","b-ampere-rule"]]},
    {t:"載流導線受磁力與電動機・發電機",d:"U 形磁鐵中的通電導線受力擺動：改變電流或磁場方向（⊙ ⊗ → ← ↑ ↓）看受力反向，電流與磁場平行時不受力，用右手開掌定則（拇指 I、四指 B、掌心 F）判斷並練習；線圈加換向器成為電動機，每轉半圈電流反向而持續轉動，換成滑環只會來回擺動；反過來用手轉線圈成為發電機，感應電流點亮燈泡、看交流與直流輸出波形，感應電流受的磁力阻礙轉動，比較電能→力學能與力學能→電能（小百科 p.95、圖 4-4、圖 4-7）。",sims:[["","b-motor-generator"]]},
    {t:"電磁感應與冷次定律（檢流計實驗）",d:"示範實驗 2：拖曳磁棒靠近、停住、遠離螺線管，看檢流計 Ⓖ 指針左右偏轉，移動越快偏越大，可換 N／S 極、匝數與軟鐵棒；線圈靠磁棒的一端感應出同極推開、異極拉住，感應電流的磁場總是抵抗磁力線數量的變化（冷次定律，圖 4-6）。再看線圈進入、停在、離開均勻磁場時數一數線圈內的磁力線（圖 4-5），並做範例 4-3 磁鐵與螺線管三種移動方式、範例 4-4 開關打開與關上瞬間副線圈的電流方向，附想一想：載磁鐵的火車通過線圈山洞。",sims:[["","b-lenz-galvanometer"]]},
    {t:"電磁波與電磁波譜",d:"電場 E 與磁場 B 互相垂直、同相振盪並與傳遞方向垂直的 3D 動畫（可拖曳轉動、改變傳遞方向），用右手由 E 轉向 B 判斷傳遞方向並練習（範例 4-6）；拖曳頻率從無線電波到 γ 射線，即時算 λ = c／f，標出波段、生活應用與差不多大的物體（圖 4-10），附範例 4-7 5G 28 GHz → 1.07 cm；再看微波爐 2.45 GHz（約 12.2 cm）的電場讓水分子來回轉動而加熱（圖 4-11）。",sims:[["","b-em-spectrum"]]},
    {t:"惠更斯原理與反射定律",d:"惠更斯反射實驗室：用波前上每一點發出的次波畫出反射波前，推導入射角等於反射角。",sims:[],url:"https://yi-hung-bit.github.io/huygens-reflection-lab/"},
    {t:"惠更斯原理與折射定律",d:"惠更斯折射實驗室：互動波前模擬，看波進入不同介質時波速改變、波前轉折，推導司乃耳定律。",sims:[],url:"https://yi-hung-bit.github.io/huygens-refraction-lab/"},
    {t:"光的折射與司乃耳定律",d:"光從空氣、水、玻璃等介質斜射入另一介質：拖曳改變入射角，用半徑 10 cm 的輔助圓量出 x₁、x₂，記錄成表看 x₁ / x₂ 為定值（表 4-2 真空→水 1.33），即折射率 n = c / v；光疏→光密偏向法線、光密→光疏偏離法線，波前間距顯示光變慢、波長變短，入射角太大時沒有折射光。附範例 4-8（a = 6、b = 4 → n = 1.50，a = 3 時 b = 2）、範例 4-9 潛水員的光射入甲乙丙比較光速，以及水中杯子看起來較淺的視覺偏差（圖 4-15、圖 4-16）。",sims:[["","b-snell-refraction"]]},
    {t:"焦耳實驗・熱功當量",d:"重錘落下帶動葉輪攪拌隔熱水桶裡的水，水溫上升：可調重錘質量、落下高度、重複次數與水量，比較重錘減少的力學能 W = nMgh 與水吸收的熱 Q = mcΔT，求出熱功當量 J = W／Q ≈ 4.186 J/cal，畫 ΔT–W 圖；拉動熱量損失看誤差往哪邊跑。再走一次科學方法：熱質說 → 倫福德削砲管 → 焦耳實驗 → 熱是能量（圖 1-2、圖 5-10）。",sims:[["","b-joule-equivalent"]]},
    {t:"光的干涉與繞射",d:"楊氏雙狹縫：用惠更斯子波看兩組圓形波疊加出腹線與節線，拖曳探針看程差是整數個波長（亮紋）或半波長的奇數倍（暗紋），可調波長 400～700 nm、縫距、縫寬與屏距，看條紋變密或變疏；單狹縫繞射的中央亮紋約是其他亮紋的 2 倍寬；水波通過寬縫與窄縫、繞過障礙物（圖 4-19）；白光照在肥皂膜與油膜上，膜厚不同、加強的顏色不同（圖 4-18）。",sims:[["","b-light-interference"]]},
    {t:"功與動能・位能",d:"水平力 F 推光滑水平面上的木塊，可調 F、力與位移的夾角 θ、質量、初速與距離，看 W = Fd cos θ 與動能 K = ½mv² 一起變化（功能定理 W = ΔK），同向、銳角作正功、垂直不作功、鈍角與反向作負功；等速把物體直接舉高或沿光滑斜面推上去，W = mgh 存成重力位能，斜面省力但路程較長、功相同，並算功率 P = ΔW／Δt。附範例 5-1（8 N、2 kg、1 秒 → 4 m/s、2 m、16 J）與正功負功判斷練習（圖 5-1～5-3、小百科）。",sims:[["","b-work-energy"]]},
    {t:"力學能守恆",d:"小車在可拖曳改變高度的山丘與低谷軌道上運動，即時看動能 K、位能 U 與力學能 E = K + U 的長條與能量–時間圖（圖 5-4），黃色虛線標出能到達的最高高度 E/mg；加上摩擦看力學能減少、變成熱能，但 K + U + 熱能仍守恆。另有甲乙丙相同初速越過山丘、低谷與平直軌道的競走（想一想、示範實驗 4：凹陷軌道先到）、範例 5-2 水滑道落差相同末速都是 √(2gH) 但一開始陡的先到，以及範例 5-3 雲霄飛車 50 kg、20 m/s 到 4 m 高終點 K = 8000 J、v = 8√5 m/s。",sims:[["","b-energy-conservation"]]},
    {t:"氣體分子運動・溫度與絕對零度",d:"密閉瓶中的氣體分子亂撞，調整瓶底熱源溫度與氣體種類，看溫度越高、分子平均速率與平均動能越大，熱能是所有分子動能的總和，但每個分子的速率仍各不相同（速率分布、追蹤一個分子）；高溫區與低溫區經導熱隔板接觸，分子碰撞把能量由高溫傳到低溫直到熱平衡（圖 5-6）；四瓶定容氣體量壓力–溫度直線，外插都交在 −273.15 ℃，引出絕對零度與 K = ℃ + 273.15（圖 5-7、圖 5-8），附範例 5-4 溫度排序與換一題練習。",sims:[["","b-gas-temperature"]]},
    {t:"能量轉換與發電效率",d:"水力發電：可調水位落差、流量與效率，看水的重力位能 → 動能 → 渦輪轉動動能 → 電能，P = η·ρQgh，附範例 5-5 烏山頭水力發電廠 24 m、41 m³/s、90 % → 8820 kW（圖 5-9）；火力發電：燃料化學能 → 高溫蒸氣 → 汽輪機 → 電能，調整鍋爐、汽輪機與發電機效率，看大部分能量從冷凝器排進海水、各部分加起來仍等於燃料的化學能（圖 5-13）；再把熱水瓶、電子鍋、微波爐插上延長線，I = P／V 相加 5 + 6 + 9 = 20 A 超過安全負載（圖 5-22），並換算用電度數（1 度 = 3.6 × 10⁶ J）與電費。",sims:[["","b-power-generation"]]}

    {t:"簡易物質分離",d:"實驗 2-1：食鹽和碳粉加水攪拌溶解、過濾、再加熱蒸發濾液取回食鹽；用粒子模型看食鹽粒子穿過濾紙孔隙、碳粉留下。調整食鹽、碳粉與水量，水太少時沒溶解的食鹽會留在濾渣裡。完成分離流程圖，並比較用磁鐵分離鐵粉與細砂。",sims:[["","j-separation"]]},

body:`<figure class="fig"><img src="fyq/2017-01-fig1.jpg" alt="圖 1：絕熱氣筒，B 在上、A 在下，底部有加熱器"><span>圖 1</span></figure><p>一、理想氣體的受熱膨脹</p><p>如圖 1 所示，一個除了底部之外，器壁均為絕熱的氣筒，以一隔板將該筒隔成體積相等的 A、B 兩部分，各裝有 \\(1\\ \\mathrm{mole}\\) 初始溫度為 \\(0^\\circ\\mathrm{C}\\)、氣壓為 \\(1\\ \\mathrm{atm}\\) 的氦氣。氣筒的頂部為一活塞（亦為絕熱），其上壓力始終保持為 \\(P_0=1\\ \\mathrm{atm}\\)。今將 \\(80.0\\ \\mathrm{cal}\\) 的熱量緩慢地由氣筒底部輸入氣筒。假設氦氣可視為理想氣體，氣體常數 \\(R=8.31\\ \\mathrm{J/mole\\cdot K}\\)，試求下述兩種情況下，A 和 B 兩部分氣體之壓力、體積、與溫度的變化量各為若干。</p><p>(A) 隔板固定且導熱（其熱容量可以忽略）；（13 分）</p><p>(B) 隔板可自由滑動（無摩擦）且絕熱。（12 分）</p>`,
sol:`<h4>詳解</h4><table><tr><th></th><th>\\(\\Delta P/\\mathrm{Pa}\\)</th><th>\\(\\Delta V/\\mathrm{L}\\)</th><th>\\(\\Delta T/\\mathrm{K}\\)</th></tr><tr><td>(a)</td><td>A (2480)；B (0)</td><td>A (0)；B (0.552)</td><td>A (6.71)；B (6.71)</td></tr><tr><td>(b)</td><td>A (0)；B (0)</td><td>A (0.94)；B (0)</td><td>A (11.51)；B (0)</td></tr></table><p>(A) 起始時，A 和 B 兩部分體積內的氦氣狀態方程式為：</p><p>\\[P_0V_{A0}=P_0V_{B0}=RT_0\\]</p><p>\\[V_{A0}=V_{B0}=RT_0/P_0=8.31\\times273/(1.01\\times10^5)=22.5\\ \\mathrm{L}。\\]</p><p>隔板固定但可導熱，緩慢輸入的 \\(80\\ \\mathrm{cal}\\) 熱能，將均勻對氣筒內氦氣加溫，A 和 B 兩部分體積內的氦氣最終溫度相同，內能增加量相等。因氦氣為雙原子氣體，在考慮的溫度範圍內 \\(C_V=5R/2\\)，故</p><p>\\[\\Delta U_{A+B}=nC_V\\Delta T=2\\times(5R/2)\\Delta T=Q-W。\\]</p><p>\\[\\Rightarrow 5R\\Delta T=80.0\\times4.18-P_0\\Delta V_B……(1)（等壓過程）\\]</p><p>又 \\(P_0(V_{B0}+\\Delta V_B)=R(T_0+\\Delta T)\\)……(2)</p><p>\\[\\Rightarrow 5R\\Delta T=80.0\\times4.18-P_0(R\\Delta T/P_0)=332.8-R\\Delta T。\\]</p><p>\\[\\Rightarrow \\Delta T=6.71\\ \\mathrm{K}。\\text{(A 和 B 的氦氣溫度變化相同)}\\]</p><p>A 部分的壓力變化：（此部分體積不變 \\(\\Delta V_A=0\\)）</p><p>\\[P_AV_{A0}=RT_f\\Rightarrow(P_0+\\Delta P_A)=R(T_0+\\Delta T)。\\]</p><p>\\[\\Delta P_A=R\\Delta T/V_{A0}=8.31\\times6.71/(22.5\\times10^{-3})=2480\\ \\mathrm{Pa}。\\]</p><p>B 部分的體積變化：（此部分壓力不變 \\(\\Delta P_B=0\\)）</p><p>\\[\\Delta V_B=R\\Delta T/P_0=8.31\\times6.71/(1.01\\times10^5)=0.552\\ \\mathrm{L}。\\]</p><p>(B) 隔板絕熱，且可自由移動：</p><p>因隔板絕熱，故所有輸入的熱能均在 A 部分。</p><p>\\[\\Delta U_A=Q-W\\]</p><p>\\[(5R/2)\\Delta T_A=80.0\\times4.18-P_0(\\Delta V_A)；\\]</p><p>又 \\(P_0(V_{A0}+\\Delta V_A)=R(T_0+\\Delta T)\\)。</p><p>\\[(7R/2)\\Delta T_A=80.0\\times4.18。\\]</p><p>\\[\\Delta T_A=11.5\\ \\mathrm{K}；\\Delta V_A=R\\Delta T_A/P_0=0.946\\ \\mathrm{L}；\\]</p><p>\\[\\Delta P_A=\\Delta P_B=0；\\Delta V_B=0；\\Delta T_B=0。\\]</p><p class="fnote">註：氦氣實為單原子氣體（\\(C_V\\) 應為 \\(3R/2\\)）；此處數值皆按官方詳解（取 \\(C_V=5R/2\\)）列出。</p>`}];

function loadPdfJs(){

const pv=$("#pdfview"); let pvDoc=null, pvObs=null;
async function openPdf(it){
  $("#pvTitle").textContent=`${it.v.vol}・${it.ch.t}`; $("#pvInfo").textContent=`${it.f.label}・${it.f.by||""}`;
  const body=$("#pvBody"); body.innerHTML=`<p class="pvmsg">載入中…</p>`; body.scrollTop=0;
  pv.hidden=false; document.documentElement.classList.add("in-class"); $("#pvClose").focus();
  $("#pvDl").onclick=()=>downloadPdf(it,$("#pvDl"));
  $("#pvDl").hidden=!!it.viewOnly||DB2_VIEW_ONLY&&(it.url.startsWith("db2/ge-")||it.url.startsWith("library/")||it.url.startsWith("math/"));
  try{
    const lib=await loadPdfJs();
    const doc=await lib.getDocument({url:it.url}).promise; if(pv.hidden) return; pvDoc=doc;
    body.innerHTML=""; const w=Math.min(body.clientWidth-8,980);
    const first=await doc.getPage(1), vp0=first.getViewport({scale:1}), ratio=vp0.height/vp0.width;
    if(pvObs) pvObs.disconnect();
    pvObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target.dataset.done){e.target.dataset.done=1;drawPage(doc,+e.target.dataset.n,e.target);}}),{root:body,rootMargin:"600px 0px"});
    for(let n=1;n<=doc.numPages;n++){const d=document.createElement("div");d.className="pvpage";d.dataset.n=n;d.style.width=w+"px";d.style.height=Math.round(w*ratio)+"px";d.innerHTML=`<span>${n} / ${doc.numPages}</span>`;body.appendChild(d);pvObs.observe(d);}
    $("#pvInfo").textContent=`${it.f.label}・${it.f.by||""}・共 ${doc.numPages} 頁`;
  }catch(e){ body.innerHTML=`<p class="pvmsg">這份 PDF 現在打不開，請檢查網路後再試一次，或直接下載。</p>`; }
}
async function drawPage(doc,n,box){
  const pg=await doc.getPage(n), w=box.clientWidth, dpr=Math.min(window.devicePixelRatio||1,2);
  const vp=pg.getViewport({scale:w/pg.getViewport({scale:1}).width*dpr});
  const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height; cv.style.width="100%";
  await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
  box.appendChild(cv);
}
function closePdf(){pv.hidden=true;document.documentElement.classList.remove("in-class");if(pvObs)pvObs.disconnect();if(pvDoc){pvDoc.destroy();pvDoc=null;}$("#pvBody").innerHTML="";}

async function downloadPdf(it,btn){
  const old=btn.textContent; btn.disabled=true; btn.textContent="準備中…";
  try{
    const blob=await (await fetch(it.url)).blob();
    const dl=window.claude?.use?await window.claude.use("downloads"):null;
    if(dl){ await dl.save({filename:it.name,data:blob}); }
    else{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=it.name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); }
    btn.textContent="已下載";
  }catch(e){ btn.textContent=e&&e.code==="declined"?old:"下載失敗"; }
  setTimeout(()=>{btn.textContent=old;btn.disabled=false;},2500);
}

/* ---------- 3D campus ---------- */
function init3D(){
  if(!window.THREE) return false;
  const box=$("#scene"), labelBox=$("#labels");
  let renderer;
  try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});}catch(e){return false;}
  if(!renderer.getContext()) return false;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  box.insertBefore(renderer.domElement,labelBox);

  const col=n=>new THREE.Color(css(n)||"#999999").convertSRGBToLinear();
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(30,1,.1,400);
  const hemi=new THREE.HemisphereLight(0xffffff,0x88907a,.75); scene.add(hemi);
  const sun=new THREE.DirectionalLight(0xffffff,.95); sun.position.set(14,26,18); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-44,right:44,top:36,bottom:-18,near:1,far:120});
  scene.add(sun);
  const glow=new THREE.PointLight(0xffd27a,0,14); scene.add(glow);

  const M={
    wall:new THREE.MeshStandardMaterial({roughness:.85}), wallT:new THREE.MeshStandardMaterial({roughness:.75}),
    slab:new THREE.MeshStandardMaterial({roughness:.7}), trim:new THREE.MeshStandardMaterial({roughness:.5,metalness:.3}),
    glass:new THREE.MeshStandardMaterial({roughness:.15,metalness:.55}), lawn:new THREE.MeshStandardMaterial({roughness:1}),
    pave:new THREE.MeshStandardMaterial({roughness:.95}), leaf:new THREE.MeshStandardMaterial({roughness:.9,flatShading:true}),
    trunk:new THREE.MeshStandardMaterial({roughness:.9}),
    tube:new THREE.MeshStandardMaterial({color:0xaed3e6,transparent:true,opacity:.28,roughness:.1,metalness:.2,depthWrite:false})
  };
  const mesh=(g,m,x,y,z,cast=true,recv=true)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=recv;return o;};
  const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d);

  const H=1.08, BASE=1.4, W=6.4, D=4.8, SX=-6.4, TX=6.4;
  const floorObjs={}, pickables=[];

  /* ground */
  /* 科技園區基地：方整草坪＋外環道 */
  const PW=84, PD=60, PZ=.6;
  scene.add(mesh(B(PW+1.2,.5,PD+1.2),M.slab,0,-.35,PZ,false,true));
  scene.add(mesh(B(PW,.3,PD),M.lawn,0,-.15,PZ,false,true));
  scene.add(mesh(B(W+2.6,.06,D+2.6),M.pave,SX,.03,0,false,true));
  scene.add(mesh(B(W+2.6,.06,D+2.6),M.pave,TX,.03,0,false,true));
  scene.add(mesh(B(TX-SX,.05,2.2),M.pave,0,.025,D/2+2.6,false,true));
  scene.add(mesh(B(3.4,.04,PZ+PD/2-1.9-(D/2+2.6)),M.pave,0,.02,(D/2+2.6+PZ+PD/2-1.9)/2,false,true));

  function lobby(x,mat){
    const g=new THREE.Group(); g.position.x=x; scene.add(g);
    g.add(mesh(B(W-.6,BASE,D-.6),mat,0,BASE/2,0));
    g.add(mesh(B(W-1.4,BASE*.78,.06),M.glass,0,BASE*.42,(D-.6)/2+.03,false,false));
    for(let i=-3;i<=3;i++) g.add(mesh(B(.08,BASE*.8,.1),M.trim,i*(W-1.4)/6,BASE*.42,(D-.6)/2+.07,false,false));
    g.add(mesh(B(3,.14,1.4),M.slab,0,BASE*.86,(D-.6)/2+.7));
    [-1.3,1.3].forEach(px=>g.add(mesh(new THREE.CylinderGeometry(.07,.07,BASE*.86,10),M.trim,px,BASE*.43,(D-.6)/2+1.3)));
  }

  /* 模擬大樓：窗戶＝教室；競賽大樓：直向鰭板立面 */
  function buildFloor(key,f,bld,x,y,w,d,h,nWin){
    const g=new THREE.Group(); g.position.set(x,y,0); scene.add(g);
    const accentMat=new THREE.MeshStandardMaterial({roughness:.5});
    const lit=new THREE.MeshStandardMaterial({roughness:.2,metalness:.2,emissive:new THREE.Color(0),emissiveIntensity:1});
    const wallM=bld==="t"?M.wallT:M.wall;
    const slab=mesh(B(w+.3,h*.16,d+.3),M.slab,0,h*.08,0); g.add(slab);
    const body=mesh(B(w,h*.84,d),wallM,0,h*.58,0); g.add(body);
    const band=mesh(B(w+.32,h*.05,.05),accentMat,0,h*.13,(d+.3)/2+.01,false,false); g.add(band);
    const parts=[slab,body,band];
    if(bld==="t"){
      const strip=mesh(B(w-.5,h*.56,.06),lit,0,h*.6,d/2+.02,false,false); g.add(strip); parts.push(strip);
      const fins=Math.max(4,nWin*2);
      for(let i=0;i<=fins;i++){const fx=-(w-.5)/2+(w-.5)*i/fins; g.add(mesh(B(.07,h*.6,.22),wallM,fx,h*.6,d/2+.1,false,false));}
      [-1,1].forEach(s=>g.add(mesh(B(.06,h*.56,d-.8),lit,s*(w/2+.02),h*.6,0,false,false)));
    }else{
      const span=(w-.8)/nWin;
      for(let i=0;i<nWin;i++){
        const wx=-(w-.8)/2+span*(i+.5);
        const pane=mesh(B(span*.8,h*.52,.06),lit,wx,h*.6,d/2+.02,false,false); g.add(pane); parts.push(pane);
        g.add(mesh(B(.06,h*.52,.09),M.trim,wx,h*.6,d/2+.05,false,false));
        g.add(mesh(B(span*.86,.05,.16),M.trim,wx,h*.33,d/2+.06,false,false));
      }
      [-1,1].forEach(s=>{for(let k=0;k<2;k++) g.add(mesh(B(.06,h*.46,d*.28),M.glass,s*(w/2+.02),h*.6,-d/4+k*d/2,false,false));});
    }
    parts.forEach(o=>{o.userData.key=key;pickables.push(o);});
    floorObjs[key]={key,f,bld,g,lit,accentMat,x,y,h,w,d,z0:0,off:0,glow:0};
    return floorObjs[key];
  }

  function signTexture(main,sub,plateVar){
    const c=document.createElement("canvas"); c.width=1024; c.height=256;
    const tex=new THREE.CanvasTexture(c); tex.encoding=THREE.sRGBEncoding; tex.anisotropy=4;
    tex.redraw=()=>{const x=c.getContext("2d"); x.clearRect(0,0,1024,256);
      x.fillStyle=css(plateVar)||"#1f3347"; x.beginPath(); x.roundRect?x.roundRect(8,8,1008,240,28):x.rect(8,8,1008,240); x.fill();
      x.fillStyle=css("--plate-ink")||"#f4f1e8"; x.textAlign="center";
      x.font='900 118px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif'; x.fillText(main,512,148);
      x.font='600 40px "IBM Plex Mono",monospace'; x.globalAlpha=.7; x.fillText(sub,512,212); x.globalAlpha=1; tex.needsUpdate=true;};
    return tex;
  }
  const signs=[];
  function roofSign(x,roofY,main,sub,plateVar){
    const tex=signTexture(main,sub,plateVar); signs.push(tex);
    scene.add(mesh(new THREE.PlaneGeometry(3.2,.8),new THREE.MeshBasicMaterial({map:tex,transparent:true}),x+1.4,roofY+1.05,D/2-.1,false,false));
    [x+.2,x+2.6].forEach(px=>scene.add(mesh(B(.06,.7,.06),M.trim,px,roofY+.55,D/2-.12,false,false)));
  }
  function roof(x,roofY){
    scene.add(mesh(B(W+.3,.18,D+.3),M.slab,x,roofY+.09,0));
    [(D+.3)/2,-(D+.3)/2].forEach(z=>scene.add(mesh(B(W+.3,.35,.08),M.slab,x,roofY+.35,z)));
    [(W+.3)/2,-(W+.3)/2].forEach(dx=>scene.add(mesh(B(.08,.35,D+.3),M.slab,x+dx,roofY+.35,0)));
  }

  /* 模擬大樓（左） */
  lobby(SX,M.wall);
  const simUpper=SIM_UP.filter(f=>f.id!=="R");
  simUpper.forEach((f,i)=>buildFloor("s"+f.id,f,"s",SX,BASE+i*H,W,D,H,Math.max(1,Math.min(f.rooms.length,10))));
  const simRoof=BASE+simUpper.length*H; roof(SX,simRoof);
  {const o=buildFloor("sR",sFloor("R"),"s",SX-1.1,simRoof+.18,4.2,3,1.1,Math.max(1,Math.min(sFloor("R").rooms.length,5))); o.z0=-.4;}
  roofSign(SX,simRoof,"模 擬 大 樓","S I M U L A T I O N","--plate");

  /* 競賽大樓（右） */
  lobby(TX,M.wallT);
  const thUpper=THEORY.filter(f=>f.id!=="R");
  thUpper.forEach((f,i)=>buildFloor("t"+f.id,f,"t",TX,BASE+i*H,W,D,H,f.rooms.length));
  const thRoof=BASE+thUpper.length*H; roof(TX,thRoof);
  {const o=buildFloor("tR",tFloor("R"),"t",TX-1.1,thRoof+.18,4.2,3,1.1,3); o.z0=-.4;}
  roofSign(TX,thRoof,"競 賽 A 棟","C O N T E S T  A","--plate-t");
  /* 競賽大樓頂：天文台圓頂 */
  scene.add(mesh(new THREE.CylinderGeometry(.9,.9,.5,24),M.wallT,TX+1.9,thRoof+.43,-1.2));
  scene.add(mesh(new THREE.SphereGeometry(.9,24,12,0,Math.PI*2,0,Math.PI/2),M.slab,TX+1.9,thRoof+.68,-1.2));

  /* 3F 空橋 */
  const bi=simUpper.findIndex(f=>f.id===BRIDGE_LEVEL), by=BASE+bi*H;
  const bx0=SX+W/2, bx1=TX-W/2, bl=bx1-bx0, bcx=(bx0+bx1)/2, bw=1.6;
  const bridge=new THREE.Group(); bridge.position.set(bcx,by,.4); scene.add(bridge);
  const bFloor=mesh(B(bl,.14,bw),M.slab,0,.07,0); bridge.add(bFloor);
  const bRoof=mesh(B(bl,.1,bw+.1),M.trim,0,H*.86,0); bridge.add(bRoof);
  const bTube=mesh(B(bl,H*.72,bw),M.tube,0,H*.5,0,false,false); bridge.add(bTube);
  for(let i=0;i<=6;i++){const px=-bl/2+bl*i/6;[-1,1].forEach(s=>bridge.add(mesh(B(.06,H*.72,.06),M.trim,px,H*.5,s*bw/2)));}
  [-1,1].forEach(s=>bridge.add(mesh(B(bl,.05,.05),M.trim,0,H*.42,s*bw/2)));
  [bFloor,bRoof,bTube].forEach(o=>{o.userData.key="bridge";pickables.push(o);});
  const bridgeLit=new THREE.MeshStandardMaterial({color:0xfff3d6,emissive:new THREE.Color(0xffe2a0).convertSRGBToLinear(),emissiveIntensity:0});
  bridge.add(mesh(B(bl-.4,.03,.5),bridgeLit,0,H*.8,0,false,false));
  /* 空橋支柱 */
  [bcx-bl/4,bcx+bl/4].forEach(px=>scene.add(mesh(new THREE.CylinderGeometry(.12,.12,by,10),M.trim,px,by/2,.4)));

    d.g.rotation.y=-a-(d.w>0?0:Math.PI); d.props.forEach(p=>p.rotation.y+=dt*40); droneLit.emissiveIntensity=(Math.floor(t/600)%2)?1.4:.2;}));

  /* 風力發電機 */
  function turbine(x,z,h,ph){
    scene.add(mesh(new THREE.CylinderGeometry(.08,.16,h,10),curbM,x,h/2,z));
    scene.add(mesh(B(.5,.3,.3),curbM,x,h+.05,z));
    const hub=new THREE.Group(); hub.position.set(x,h+.05,z+.2); scene.add(hub);
    hub.add(mesh(new THREE.SphereGeometry(.12,10,8),curbM,0,0,0));
    for(let k=0;k<3;k++){const bl=new THREE.Group(); bl.rotation.z=k*Math.PI*2/3; bl.add(mesh(B(.12,1.9,.04),curbM,0,.95,0)); hub.add(bl);}
    tick.push((dt)=>{hub.rotation.z+=dt*(.9+ph*.2);});
  }
  turbine(-21.6,-2.2,6.5,0); turbine(-21.6,2.4,5.6,1);
  /* 中央大道兩側植栽 */
  const TREES=[[-2.4,D/2+5.6],[2.4,D/2+5.6],[-2.4,D/2+9],[2.4,D/2+9],
    [-26,RZ1-2.6],[-9.6,RZ1-2.6],[9.6,RZ1-2.6],[26,RZ1-2.6],
    [-6,RZ0+2.2],[0,RZ0+2.2],[5,RZ0+2.2],[-15,-1.6],[-9.8,-6.8],[1.6,-7.6],
    [23.4,-4.6],[-22.9,3.4],[-14.6,2.4],[25.6,3.4],[25.6,8.6],[-26,-14],[26,-15.5],[-26,9],[-9.6,-14.6],
    /* 拓寬後的新腹地：外圈綠帶 */
    ...[-32,-26,-4,6,26,33].flatMap((x,i)=>[[x+(i%2)*1.5,RZ0+3.6],[x-(i%2),RZ1-3.8]]),
    ...[-14,-6,2,10,18].flatMap((z,i)=>[[-RX+3.8,z+(i%2)],[RX-3.8,z-(i%2)*1.2],[-33,z+3],[33.5,z-2.5]])];
  const inR=(x,z,x0,x1,z0,z1)=>x>x0&&x<x1&&z>z0&&z<z1;
  TREES.filter(([x,z])=>!(Math.abs(z-FZ)<1.6&&Math.abs(x)>SR-1)&&!inR(x,z,MX-5,MX+5,MZ-4,MZ+4)&&!inR(x,z,SF.x0-1.5,SF.x1+2.5,SF.z0-1.5,SF.z1+2)&&!inR(x,z,EV.cx-EV.w/2-1.5,EV.cx+EV.w/2+1.5,EV.cz-EV.d/2-1.5,EV.cz+EV.d/2+1.5)).forEach(([x,z],i)=>{const s=.8+((i*37)%10)/25;
    scene.add(mesh(new THREE.CylinderGeometry(.1*s,.14*s,1*s,7),M.trunk,x,.5*s,z));
    scene.add(mesh(new THREE.IcosahedronGeometry(.9*s,0),M.leaf,x,1.5*s,z));
    scene.add(mesh(new THREE.IcosahedronGeometry(.65*s,0),M.leaf,x+.3*s,2.1*s,z-.1));});

  /* labels */
  const labels={};
  Object.values(floorObjs).forEach(o=>{
    const b=document.createElement("button"); b.type="button"; b.className="flabel"; b.style.setProperty("--fc",`var(${o.f.color})`);
    b.innerHTML=`<i>${o.f.lvl}</i><span class="nm">${esc(o.f.name)}</span>`;
    b.setAttribute("aria-label",`${o.bld==="t"?"競賽大樓 A 棟":o.bld==="k"?"競賽大樓 B 棟":o.bld==="m"?"數學大樓":"模擬大樓"} ${o.f.lvl} ${o.f.name}`);
    b.onclick=()=>go(o.key); labelBox.appendChild(b); labels[o.key]=b;
  });
  const bLabels=[["s",SX,simRoof+1.9,"模擬大樓","--plate"],["t",TX,thRoof+1.9,"競賽 A 棟","--plate-t"],["k",KX,kRoof+1.9,"競賽 B 棟","--plate-t"],["m",mLabel[0],mLabel[1]+1.9,"數學大樓","--plate-t"],["bridge",bcx,by+H+.35,"空橋","--plate"],["gym",GX,GH+2.2,"休閒中心","--gym"],["lib",LX,5.6,"物理藏經閣","--lib"],["db",DX,DH+2.2,"二階資料庫","--db"],["lab",EX-3.4,EH+1.1,"實驗大樓","--lab"]].map(([k,x,y,t,pv])=>{
    const b=document.createElement("button"); b.type="button"; b.className="blabel"; b.textContent=t; b.style.setProperty("--bp",`var(${pv})`);
    b.onclick=()=>go(k==="bridge"||k==="gym"||k==="lib"||k==="db"||k==="lab"?k:k+"1"); labelBox.appendChild(b); return {b,p:new THREE.Vector3(x,y,k==="bridge"?.4:k==="k"?KZ:k==="m"?mLabel[2]:k==="gym"?GZ:k==="lib"?LZ:k==="db"?DZ:k==="lab"?EZ:0)};
  });

  let night=false;
  function applyTheme(){
    night=css("--night")==="1";
    M.wall.color=col("--wall"); M.wallT.color=col("--wall-t"); M.slab.color=col("--slab"); M.trim.color=col("--trim");
    M.glass.color=col("--glass"); M.lawn.color=col("--lawn"); M.pave.color=col("--ground");
    M.leaf.color=col("--leaf"); M.trunk.color=col("--trunk");
    gymWall.color=col("--gym-wall"); gymRoof.color=col("--gym-roof"); gymAcc.color=col("--gym");
    labWall.color=col("--lab-wall"); labAcc.color=col("--lab"); labGlass.color=col("--lab-glass");
    dbWall.color=col("--db-wall"); dbAcc.color=col("--db"); dbGlass.color=col("--db-glass");
    libWall.color=col("--lib-wall"); libRoof.color=col("--lib-roof"); libRed.color=col("--lib"); libStone.color=col("--lib-stone");
    Object.values(floorObjs).forEach(o=>{o.accentMat.color=col(o.f.color); o.lit.color=col("--glass");});
    hemi.intensity=night?.28:.75; sun.intensity=night?.22:.95; sun.color=new THREE.Color(night?0x9fb4d9:0xfff4e0);
    bridgeLit.emissiveIntensity=night?.9:.15;
    roadM.color=col("--road"); curbM.color=col("--curb"); ringM.color=col("--curb"); solarM.color=col("--solar"); waterM.color=col("--water");
    lampLit.emissiveIntensity=night?1.8:.05;
    signs.forEach(t=>t.redraw());
  }
  applyTheme();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>signs.forEach(t=>t.redraw()));
  const mq=window.matchMedia("(prefers-color-scheme: dark)");
  (mq.addEventListener?mq.addEventListener("change",applyTheme):mq.addListener(applyTheme));
  new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

  /* camera */
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const topY=Math.max(thRoof,kRoof)+2.6;
  let az=.38, el=.34, dist=40, lastUser=-1e9; const t0=performance.now();
  const target=new THREE.Vector3(0,topY*.28,0);
  function fit(){
    const w=box.clientWidth,h=box.clientHeight; renderer.setSize(w,h,false); cam.aspect=w/h; box.classList.toggle("narrow",w<560);
    const vf=THREE.MathUtils.degToRad(cam.fov)/2, hf=Math.atan(Math.tan(vf)*cam.aspect);
    dist=Math.max((topY+1.5)/2/Math.tan(vf),(PW+4)/2/Math.tan(hf))*1.0;
    cam.updateProjectionMatrix();
  }
  fit(); new ResizeObserver(fit).observe(box);

  let drag=null, moved=0, hover=null;
  const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
  function pick(e){const r=renderer.domElement.getBoundingClientRect();ptr.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ptr,cam);const hit=ray.intersectObjects(pickables,false)[0];return hit?hit.object.userData.key:null;}
  renderer.domElement.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,az,el};moved=0;});
  window.addEventListener("pointermove",e=>{
    if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
      if(moved>4){az=drag.az-dx*.007; el=Math.min(.62,Math.max(.03,drag.el+dy*.004)); lastUser=performance.now();}}
    else if(e.target===renderer.domElement){hover=pick(e);renderer.domElement.style.cursor=hover?"pointer":"";}
  });
  window.addEventListener("pointerup",e=>{if(drag&&moved<=4&&e.target===renderer.domElement){const k=pick(e);if(k)go(k);}drag=null;});
  renderer.domElement.addEventListener("pointerleave",()=>{hover=null;});

  const v=new THREE.Vector3(), litC=new THREE.Color();
  let last=performance.now();
  function place(el,x,y,anchorRight){
    const W2=box.clientWidth, w=el.offsetWidth;
    let px=anchorRight?x-w:x; px=Math.max(6,Math.min(W2-w-6,px));
    el.style.transform=`translate(${px}px,${y-11}px)`;
  }
  function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min(.05,(now-last)/1000); last=now;
    const idle=now-lastUser>3500&&!drag&&!reduce;
    const a=WPM?az+(now-t0)/1000*.05:az+(idle?Math.sin((now-t0)/6000)*.18:0);   // 桌布模式：每約 2 分鐘轉一圈
    cam.position.set(target.x+dist*Math.sin(a)*Math.cos(el),target.y+dist*Math.sin(el),target.z+dist*Math.cos(a)*Math.cos(el));
    cam.lookAt(target);
    if(!cls.hidden||!qv.hidden||!pv.hidden) return;
    const c=current(), sel=c.b==="t"||c.b==="s"||c.b==="k"||c.b==="m"?c.b+c.id:null;
    litC.set(css("--glass-lit")||"#ffd978").convertSRGBToLinear();
    let gl=null;
    Object.values(floorObjs).forEach(o=>{
      const on=o.key===sel, hv=o.key===hover;
      o.off+=((on?.8:hv?.22:0)-o.off)*(reduce?1:.12);
      o.glow+=((on?1:hv?.6:night?.22:0)-o.glow)*(reduce?1:.12);
      o.g.position.z=o.z0+o.off;
      o.lit.emissive.copy(litC).multiplyScalar(o.glow*1.1);
      if(on) gl=o;
      const lb=labels[o.key], left=o.bld==="s";
      v.set(o.x+(left?-o.w/2-.2:o.w/2+.2),o.y+o.h*.55,o.g.position.z+o.d/2).project(cam);
      place(lb,(v.x*.5+.5)*box.clientWidth,(-v.y*.5+.5)*box.clientHeight,left);
      lb.classList.toggle("on",on);
      const show=on||hv; lb.style.visibility=show?"visible":"hidden"; lb.style.pointerEvents=show?"auto":"none";
    });
    bLabels.forEach(({b,p})=>{v.copy(p).project(cam);place(b,(v.x*.5+.5)*box.clientWidth-b.offsetWidth/2,(-v.y*.5+.5)*box.clientHeight,false);});
    const dOn=c.b==="db"||hover==="db";
    dbLit.emissiveIntensity+=((dOn?2:night?1.2:.25)-dbLit.emissiveIntensity)*.1;
    const eOn=c.b==="lab"||hover==="lab";
    labLit.emissiveIntensity+=((eOn?1.6:night?1:.12)-labLit.emissiveIntensity)*.1;
    const lOn=c.b==="lib"||hover==="lib";
    libLit.emissiveIntensity+=((lOn?1.8:night?1.1:.15)-libLit.emissiveIntensity)*.1;
    const gOn=c.b==="gym"||hover==="gym";
    gymLit.emissiveIntensity+=((gOn?1.6:night?1:.1)-gymLit.emissiveIntensity)*.1;
    const bOn=c.b==="bridge"||hover==="bridge";
    bridgeLit.emissiveIntensity+=((bOn?1.4:night?.9:.15)-bridgeLit.emissiveIntensity)*.1;
    if(gl){glow.position.set(gl.x,gl.y+gl.h*.6,gl.g.position.z+gl.d/2+1.2);glow.intensity+=((night?1.4:.6)-glow.intensity)*.1;}else glow.intensity*=.9;
    if(!reduce){ stepWalkers(dt); tick.forEach(f=>f(dt,now)); }
    renderer.render(scene,cam);
  }
  requestAnimationFrame(frame);
  return true;
}
route();
window.addEventListener("hashchange",route);
if(!init3D()){$("#scene").hidden=true;$("#nogl").hidden=false;}
</script>
