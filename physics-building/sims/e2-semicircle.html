<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鉛直面半圓軌道—考慮動摩擦</title>
<style>
  :root{
    --ink:#22262a; --muted:#6b7378; --line:#d7dcdf; --paper:#ffffff; --panel:#f3f6f7;
    --teal:#0e7c86; --teal-soft:#d6eef0; --mag:#c2185b; --mag-soft:#fbe1ea; --amber:#b7791f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
       font-size:15px;line-height:1.55}
  header{padding:18px 24px 6px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em}
  header p{margin:4px 0 0;color:var(--muted);font-size:13px}
  main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0}
  #stage{padding:12px 16px 4px}
  canvas{display:block;width:100%}
  #anim{aspect-ratio:16/9;border:1px solid var(--line);border-radius:6px;background:#fff}
  #plots{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px}
  #plots canvas{aspect-ratio:4/3;border:1px solid var(--line);border-radius:6px;background:#fff}
  aside{background:var(--panel);border-left:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:16px}
  .ctl label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:2px}
  .ctl output{font-variant-numeric:tabular-nums;font-weight:600}
  input[type=range]{width:100%;accent-color:var(--teal)}
  .btns{display:flex;gap:8px}
  button{flex:1;padding:8px 0;border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:6px;font-size:14px;cursor:pointer;font-family:inherit}
  button.ghost{background:#fff;color:var(--teal)}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .result{border-top:1px solid var(--line);padding-top:12px;font-size:14px}
  .result dl{display:grid;grid-template-columns:auto auto;gap:4px 12px;margin:0}
  .result dt{color:var(--muted)} .result dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
  .verdict{margin-top:10px;padding:8px 10px;border-radius:6px;font-weight:600}
  .ok{background:var(--teal-soft);color:var(--teal)} .bad{background:var(--mag-soft);color:var(--mag)}
  .note{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
  .note code{font-family:inherit;background:#fff;padding:0 3px;border-radius:3px}
  @media (max-width:820px){main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line)}}
  @media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<header>
  <h1>鉛直面半圓軌道—考慮動摩擦</h1>
  <p>木塊以 v₀ 進入半徑 R 的鉛直半圓軌道（P 為最低點、M 為最高點）。切線方程 d(v²)/dθ = −2gR sinθ − 2μ(v² + gR cosθ)，以 RK4 數值積分；單位取 g = R = 1。</p>
</header>
<main>
  <section>
    <div id="stage"><canvas id="anim"></canvas></div>
    <div id="plots"><canvas id="pv"></canvas><canvas id="pn"></canvas></div>
  </section>
  <aside>
    <div class="ctl">
      <label>動摩擦係數 μ <output id="muOut">0.000</output></label>
      <input id="mu" type="range" min="0" max="0.3" step="0.001" value="0">
    </div>
    <div class="ctl">
      <label>入射動能 v₀² / gR <output id="v0Out">6.00</output></label>
      <input id="v0" type="range" min="2" max="12" step="0.05" value="6">
    </div>
    <div class="ctl">
      <label>播放速度 <output id="spdOut">1.0×</output></label>
      <input id="spd" type="range" min="0.2" max="3" step="0.1" value="1">
    </div>
    <div class="btns"><button id="play">播放</button><button id="reset" class="ghost">重設</button></div>
    <div class="result">
      <dl>
        <dt>P 點正向力 N_P</dt><dd id="nP">—</dd>
        <dt>M 點 v_M² / gR</dt><dd id="vM">—</dd>
        <dt>M 點正向力 N_M</dt><dd id="nM">—</dd>
        <dt>摩擦耗能 / mgR</dt><dd id="wf">—</dd>
        <dt>此 v₀ 的臨界 μ</dt><dd id="muC">—</dd>
      </dl>
      <div id="verdict" class="verdict ok">—</div>
    </div>
    <div class="note">正向力 N = mv²/R + mg cosθ，摩擦力 f = μN 隨位置變化，因此摩擦功不能用 μmg×弧長計算。當 N 降為 0 時木塊脫離軌道，之後做拋體運動。</div>
  </aside>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
const muIn=$('mu'),v0In=$('v0'),spdIn=$('spd');
const animC=$('anim'),pvC=$('pv'),pnC=$('pn');
const NSTEP=2000;
let prof=null, t=0, playing=false, lastTs=null;
const S={x:0,y:0,phase:'run',theta:0,vx:0,vy:0};

// ---------- physics ----------
function rhs(th,u,mu){return -2*Math.sin(th)-2*mu*(u+Math.cos(th));}
function integrate(mu,u0){
  const th=[],u=[],N=[];
  const h=Math.PI/NSTEP; let x=0,y=u0;
  let detach=null, stall=null, wf=0;
  for(let i=0;i<=NSTEP;i++){
    th.push(x);u.push(y);N.push(y+Math.cos(x));
    if(N[i]<0&&detach===null){detach=i;break;}
    if(y<=0&&stall===null){stall=i;break;}
    if(i===NSTEP)break;
    const k1=rhs(x,y,mu),k2=rhs(x+h/2,y+h/2*k1,mu),k3=rhs(x+h/2,y+h/2*k2,mu),k4=rhs(x+h,y+h*k3,mu);
    const Ncur=y+Math.cos(x); wf+=mu*Ncur*h; // f·ds in units of mgR
    y+=h/6*(k1+2*k2+2*k3+k4); x+=h;
  }
  return {th,u,N,detach,stall,mu,u0,wf};
}
function vM2exact(mu,u0){ // closed-form check
  const B=(2-4*mu*mu)/(1+4*mu*mu); return (u0-B)*Math.exp(-2*mu*Math.PI)-B;
}
function criticalMu(u0){
  if(vM2exact(0,u0)<1)return null;
  let lo=0,hi=1; if(vM2exact(hi,u0)>=1)return '>1';
  for(let i=0;i<60;i++){const m=(lo+hi)/2; (vM2exact(m,u0)>=1?lo=m:hi=m);}
  return (lo+hi)/2;
}

// ---------- layout helpers ----------
function fit(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;
  if(c.width!==Math.round(r.width*d)){c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);}
  const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}

// scene geometry (physics units: R=1) -> screen
let geo={};
function geometry(W,H){
  const Rpx=Math.min(H*0.34,W*0.2);
  const cx=W*0.62, cy=H*0.5;               // circle center
  geo={Rpx,cx,cy,W,H, runL:W*0.08};        // run-in from x=runL to P
}
const toPx=(x,y)=>[geo.cx+x*geo.Rpx, geo.cy+y*geo.Rpx]; // physics: x right, y down, center (0,0)
const posOn=th=>[Math.sin(th),Math.cos(th)];

// ---------- drawing ----------
function drawScene(){
  const [g,W,H]=fit(animC); geometry(W,H); g.clearRect(0,0,W,H);
  const {Rpx,cx,cy}=geo;
  // ground + track
  g.lineWidth=3;g.strokeStyle='#3a3f44';g.lineCap='round';
  g.beginPath();g.moveTo(geo.runL,cy+Rpx);g.lineTo(cx,cy+Rpx);g.stroke();
  g.beginPath();g.arc(cx,cy,Rpx,Math.PI/2,-Math.PI/2,true);g.stroke();
  // labels
  g.fillStyle='#6b7378';g.font='13px sans-serif';g.textAlign='center';
  g.fillText('P',cx,cy+Rpx+18);g.fillText('M',cx,cy-Rpx-8);g.fillText('C',cx-12,cy+4);
  g.setLineDash([3,4]);g.lineWidth=1;g.strokeStyle='#9aa3a8';
  g.beginPath();g.moveTo(cx,cy-Rpx);g.lineTo(cx,cy+Rpx);g.stroke();g.setLineDash([]);
  // detach marker
  if(prof&&prof.detach!==null){const th=prof.th[prof.detach];const [x,y]=posOn(th);const [px,py]=toPx(x,y);
    g.fillStyle='#c2185b';g.beginPath();g.arc(px,py,5,0,7);g.fill();
    g.fillStyle='#c2185b';g.textAlign='left';g.fillText('脫離 θ='+(th*180/Math.PI).toFixed(0)+'°',px+10,py);}
  // trajectory trace after leaving
  if(S.trail&&S.trail.length>1){g.strokeStyle='#0e7c86';g.lineWidth=1.5;g.setLineDash([4,4]);g.beginPath();
    S.trail.forEach((p,i)=>{const [px,py]=toPx(p[0],p[1]);i?g.lineTo(px,py):g.moveTo(px,py);});g.stroke();g.setLineDash([]);}
  // block
  const [bx,by]=toPx(S.x,S.y);const sz=Math.max(10,Rpx*0.13);
  g.save();g.translate(bx,by);
  if(S.phase==='arc'){g.rotate(-S.theta);g.fillStyle='#b8651b';g.fillRect(-sz/2,-sz,sz,sz);}
  else{g.fillStyle='#b8651b';g.fillRect(-sz/2,-sz,sz,sz);}
  g.restore();
  // force arrows on the arc: N (teal, toward center), f (magenta, opposing motion)
  if(S.phase==='arc'&&prof){
    const i=Math.min(prof.th.length-1,Math.round(S.theta/(Math.PI/NSTEP)));
    const Nv=prof.N[i], f=prof.mu*Nv;
    const [ux,uy]=[-Math.sin(S.theta),-Math.cos(S.theta)]; // toward center
    const [tx,ty]=[Math.cos(S.theta),-Math.sin(S.theta)];   // tangent (motion)
    const sc=Rpx*0.08;
    arrow(g,bx,by,bx+ux*Nv*sc,by+uy*Nv*sc,'#0e7c86');
    arrow(g,bx,by,bx-tx*f*sc*2,by-ty*f*sc*2,'#c2185b');
    g.fillStyle='#0e7c86';g.textAlign='left';g.font='12px sans-serif';
    g.fillText('N = '+Nv.toFixed(2)+' mg',12,20);
    g.fillStyle='#c2185b';g.fillText('f = '+f.toFixed(3)+' mg',12,36);
    g.fillStyle='#22262a';g.fillText('θ = '+(S.theta*180/Math.PI).toFixed(0)+'°   v²/gR = '+prof.u[i].toFixed(2),12,52);
  }
  if(S.msg){g.fillStyle='#22262a';g.font='13px sans-serif';g.textAlign='left';g.fillText(S.msg,12,H-14);}
}
function arrow(g,x0,y0,x1,y1,col){const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy);if(L<2)return;
  g.strokeStyle=col;g.fillStyle=col;g.lineWidth=2;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
  const a=Math.atan2(dy,dx);g.beginPath();g.moveTo(x1,y1);g.lineTo(x1-8*Math.cos(a-0.4),y1-8*Math.sin(a-0.4));
  g.lineTo(x1-8*Math.cos(a+0.4),y1-8*Math.sin(a+0.4));g.closePath();g.fill();}

function drawPlot(c,ys,title,yLabel,yMax,color,zeroLine){
  const [g,W,H]=fit(c);g.clearRect(0,0,W,H);
  const L=44,Rm=12,T=26,B=30;const pw=W-L-Rm,ph=H-T-B;
  const yMin=zeroLine?Math.min(0,...ys)-0.2:0;
  const X=th=>L+th/Math.PI*pw, Y=v=>T+ph-(v-yMin)/(yMax-yMin)*ph;
  g.strokeStyle='#e3e7ea';g.lineWidth=1;g.fillStyle='#6b7378';g.font='11px sans-serif';g.textAlign='center';
  [0,45,90,135,180].forEach(d=>{const x=X(d*Math.PI/180);g.beginPath();g.moveTo(x,T);g.lineTo(x,T+ph);g.stroke();g.fillText(d+'°',x,H-10);});
  g.textAlign='right';
  const step=yMax>6?2:1;for(let v=Math.ceil(yMin);v<=yMax;v+=step){const y=Y(v);g.beginPath();g.moveTo(L,y);g.lineTo(L+pw,y);g.stroke();g.fillText(v,L-6,y+4);}
  if(zeroLine){g.strokeStyle='#c2185b';g.setLineDash([3,3]);g.beginPath();g.moveTo(L,Y(0));g.lineTo(L+pw,Y(0));g.stroke();g.setLineDash([]);}
  else{g.strokeStyle='#c2185b';g.setLineDash([3,3]);g.beginPath();g.moveTo(L,Y(1));g.lineTo(L+pw,Y(1));g.stroke();g.setLineDash([]);
       g.fillStyle='#c2185b';g.textAlign='left';g.fillText('v²=gR（M 點最低需求）',L+4,Y(1)-4);}
  g.fillStyle='#22262a';g.font='12px sans-serif';g.textAlign='left';g.fillText(title,L,16);
  g.fillStyle='#6b7378';g.font='11px sans-serif';g.fillText(yLabel,4,T-8);
  g.strokeStyle=color;g.lineWidth=2;g.beginPath();
  ys.forEach((v,i)=>{const x=X(prof.th[i]),y=Y(v);i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();
  const end=prof.detach??prof.stall;
  if(end!==null){const x=X(prof.th[end]),y=Y(ys[end]);g.fillStyle='#c2185b';g.beginPath();g.arc(x,y,4,0,7);g.fill();}
  // playhead
  if(S.phase==='arc'){const x=X(S.theta);g.strokeStyle='#b7791f';g.beginPath();g.moveTo(x,T);g.lineTo(x,T+ph);g.stroke();}
}
function drawPlots(){
  if(!prof)return;
  const uMax=Math.ceil(Math.max(...prof.u)+0.5);
  drawPlot(pvC,prof.u,'速率平方 v² 對 θ','v²/gR',uMax,'#0e7c86',false);
  const nMax=Math.ceil(Math.max(...prof.N)+0.5);
  drawPlot(pnC,prof.N,'正向力 N 對 θ','N/mg',nMax,'#0e7c86',true);
}

// ---------- results panel ----------
function updateResults(){
  const mu=prof.mu,u0=prof.u0;
  $('nP').textContent=(u0+1).toFixed(2)+' mg';
  const v=$('verdict');
  if(prof.detach===null&&prof.stall===null){
    const uM=prof.u[NSTEP];
    $('vM').textContent=uM.toFixed(3)+'（解析解 '+vM2exact(mu,u0).toFixed(3)+'）';
    $('nM').textContent=(uM-1).toFixed(2)+' mg';
    v.className='verdict ok';v.textContent='通過 M 點，水平飛出';
  }else if(prof.detach!==null){
    const th=prof.th[prof.detach];
    $('vM').textContent='—';$('nM').textContent='—';
    v.className='verdict bad';v.textContent='θ ≈ '+(th*180/Math.PI).toFixed(1)+'° 時 N = 0，脫離軌道';
  }else{
    const th=prof.th[prof.stall];
    $('vM').textContent='—';$('nM').textContent='—';
    v.className='verdict bad';v.textContent='θ ≈ '+(th*180/Math.PI).toFixed(1)+'° 時速率歸零，回落';
  }
  $('wf').textContent=prof.wf.toFixed(3);
  const mc=criticalMu(u0);
  $('muC').textContent=mc===null?'（μ=0 也到不了）':(mc==='>1'?'> 1':mc.toFixed(4));
}

// ---------- animation ----------
function resetState(){
  t=0;playing=false;lastTs=null;$('play').textContent='播放';
  const runX=(geo.runL-geo.cx)/geo.Rpx||-3;
  Object.assign(S,{phase:'run',x:runX,y:1,theta:0,vx:Math.sqrt(prof.u0),vy:0,trail:[],msg:'',gx:runX});
}
function step(dt){
  if(S.phase==='run'){S.x+=Math.sqrt(prof.u0)*dt;if(S.x>=0){S.x=0;S.phase='arc';S.theta=0;}}
  else if(S.phase==='arc'){
    const h=Math.PI/NSTEP;
    let i=Math.round(S.theta/h);
    const end=prof.detach??prof.stall??NSTEP;
    if(i>=end){
      i=end;S.theta=prof.th[i];const [x,y]=posOn(S.theta);S.x=x;S.y=y;
      if(prof.stall!==null){S.phase='done';S.msg='速率歸零，木塊沿軌道回落（模擬結束）';return;}
      const sp=Math.sqrt(Math.max(prof.u[i],0));
      S.vx=sp*Math.cos(S.theta);S.vy=-sp*Math.sin(S.theta);S.phase='fly';S.trail=[[x,y]];
      S.msg=(prof.detach!==null)?'脫離軌道，做拋體運動':'通過 M 點，水平拋出';return;
    }
    const sp=Math.sqrt(Math.max(prof.u[i],1e-6));
    S.theta+=sp*dt; if(S.theta>prof.th[end])S.theta=prof.th[end];
    const [x,y]=posOn(S.theta);S.x=x;S.y=y;
  }else if(S.phase==='fly'){
    S.vy+=dt;S.x+=S.vx*dt;S.y+=S.vy*dt;S.trail.push([S.x,S.y]);
    if(S.y>=1){S.y=1;S.phase='done';}
    if(S.x< S.gx-1||S.x>3)S.phase='done';
  }
}
function frame(ts){
  if(!playing)return;
  if(lastTs===null)lastTs=ts;
  const dt=Math.min(0.05,(ts-lastTs)/1000)*parseFloat(spdIn.value)*1.2;lastTs=ts;
  const sub=6;for(let k=0;k<sub;k++)step(dt/sub);
  drawScene();drawPlots();
  if(S.phase==='done'){playing=false;$('play').textContent='播放';return;}
  requestAnimationFrame(frame);
}

// ---------- wiring ----------
function recompute(){
  const mu=parseFloat(muIn.value),u0=parseFloat(v0In.value);
  $('muOut').textContent=mu.toFixed(3);$('v0Out').textContent=u0.toFixed(2);
  prof=integrate(mu,u0);
  fit(animC);geometry(animC.getBoundingClientRect().width,animC.getBoundingClientRect().height);
  resetState();updateResults();drawScene();drawPlots();
}
muIn.addEventListener('input',recompute);v0In.addEventListener('input',recompute);
spdIn.addEventListener('input',()=>$('spdOut').textContent=parseFloat(spdIn.value).toFixed(1)+'×');
$('play').addEventListener('click',()=>{
  if(S.phase==='done')resetState();
  playing=!playing;$('play').textContent=playing?'暫停':'播放';lastTs=null;
  if(playing)requestAnimationFrame(frame);
});
$('reset').addEventListener('click',()=>{resetState();drawScene();drawPlots();});
window.addEventListener('resize',()=>{drawScene();drawPlots();});
recompute();
})();
</script>
</body>
</html>
