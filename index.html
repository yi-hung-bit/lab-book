<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>實驗培訓</title>
<meta name="description" content="歷屆物理學科能力競賽實驗題的虛擬實驗室">
<meta name="theme-color" content="#25306b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="實驗培訓">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
.install{border:1px solid var(--accent);color:var(--accent);background:var(--paper);border-radius:999px;padding:8px 16px;cursor:pointer}
.ios-tip{font-size:13px;color:var(--muted);margin-top:10px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 一本攤開的書（桌面雙頁、手機單頁），封面 → 目錄 → 第三章光學扉頁 → 16 個實驗各一頁 → 封底 */
:root{
  --desk:#dfe2e6; --paper:#fbfaf7; --paper-2:#f2f0ea; --ink:#1d2333; --muted:#5f6576; --rule:#d9d6cd;
  --cover:#25306b; --cover-ink:#f3f1ea; --accent:#2f3f94;
  --w-refr:#2a62c4; --w-int:#1a8762; --w-lens:#a8680c; --w-pol:#6c43b8; --c1:#8c3a5e; --c2:#a4492a; --c4:#1d6f8a;
  --shadow:0 18px 40px rgba(29,35,51,.18);
  --f-display:"LXGW WenKai TC","Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  --f-body:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#101318; --paper:#1d2027; --paper-2:#181b21; --ink:#e7e5de; --muted:#a2a6b2; --rule:#343843;
  --cover:#2b3780; --cover-ink:#f3f1ea; --accent:#9aa8f0;
  --w-refr:#7ea6f0; --w-int:#58c49c; --w-lens:#e5ac55; --w-pol:#ad8fec; --c1:#e48db3; --c2:#ec9a78; --c4:#6cc3df;
  --shadow:0 18px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#101318; --paper:#1d2027; --paper-2:#181b21; --ink:#e7e5de; --muted:#a2a6b2; --rule:#343843;
  --cover:#2b3780; --cover-ink:#f3f1ea; --accent:#9aa8f0;
  --w-refr:#7ea6f0; --w-int:#58c49c; --w-lens:#e5ac55; --w-pol:#ad8fec; --c1:#e48db3; --c2:#ec9a78; --c4:#6cc3df;
  --shadow:0 18px 40px rgba(0,0,0,.5); color-scheme:dark}

body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

/* book */
.book{display:grid;grid-template-columns:1fr 1fr;min-height:660px;perspective:2200px;filter:drop-shadow(var(--shadow))}
.book.single{grid-template-columns:1fr}
.book.cover-only{grid-template-columns:1fr 1fr}
.page{position:relative;background:var(--paper);padding:44px 46px 56px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.page.left{border-radius:6px 0 0 6px;background:linear-gradient(to left,rgba(0,0,0,.09),transparent 34px),var(--paper)}
.page.right{border-radius:0 6px 6px 0;background:linear-gradient(to right,rgba(0,0,0,.09),transparent 34px),var(--paper)}
.book.single .page{border-radius:6px;background:var(--paper)}
.page.ghost{visibility:hidden}
.page.blank{background:var(--paper-2)}
@media (prefers-reduced-motion:no-preference){
  .turn-next .page.right,.turn-next.single .page{animation:inR .45s ease-out}
  .turn-prev .page.left,.turn-prev.single .page{animation:inL .45s ease-out}
}
@keyframes inR{from{transform:rotateY(-24deg);transform-origin:left center;opacity:.3}to{transform:none;opacity:1}}
@keyframes inL{from{transform:rotateY(24deg);transform-origin:right center;opacity:.3}to{transform:none;opacity:1}}

.runhead{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:26px;letter-spacing:.05em}
.folio{position:absolute;bottom:20px;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.left .folio{left:46px} .right .folio{right:46px} .book.single .folio{left:50%;transform:translateX(-50%)}

/* cover */
.cover{background:var(--cover)!important;color:var(--cover-ink);justify-content:space-between;border-radius:4px 10px 10px 4px!important}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;background:rgba(0,0,0,.22)}
.cover .kicker{font-size:14px;letter-spacing:.3em;opacity:.8;padding-left:12px}
.cover h1{font-size:clamp(44px,7vw,72px);line-height:1.1;padding-left:12px}
.cover .sub{font-size:18px;opacity:.9;padding-left:12px;margin-top:10px}
.spectrum{display:flex;height:10px;margin:28px 0 0 12px;width:70%}
.spectrum i{flex:1}
.cover .foot{padding-left:12px;font-size:13px;opacity:.75;display:flex;flex-direction:column;gap:4px}
.open-btn{align-self:flex-start;margin-left:12px;margin-top:22px;background:var(--cover-ink);color:var(--cover);border:0;border-radius:999px;padding:10px 20px;cursor:pointer;font-family:var(--f-display);font-size:16px}
.cover-blurb{justify-content:center;gap:16px}
.cover-blurb h2{font-size:26px}
.cover-blurb p{margin:0;color:var(--muted);max-width:30em}

/* toc */
.toc h2{font-size:30px;margin-bottom:18px}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.toc li{display:flex;align-items:baseline;gap:8px}
.toc .ch{font-family:var(--f-display);font-size:17px}
.toc .lead{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-4px);min-width:16px}
.toc .pg{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.toc .sec{padding-left:2.2em;font-size:14px}
.toc .sec .ch{font-family:var(--f-body);font-size:14px}
.toc .wip .ch{color:var(--muted)}
.toc a.pg{color:var(--muted);text-decoration:none;font-family:var(--f-body);font-size:12.5px}
.toc a.pg:hover{color:var(--accent);text-decoration:underline}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;text-align:left}
.linkbtn:hover .ch{color:var(--accent)}
.toc .now .ch{color:var(--accent)}

/* chapter opener */
.opener .chno{font-family:var(--f-display);font-size:16px;color:var(--accent);letter-spacing:.2em}
.opener h2{font-size:clamp(46px,6vw,64px);line-height:1.1;margin:6px 0 14px}
.opener p{margin:0 0 18px;max-width:30em}
.prism{width:100%;max-width:300px;margin:4px 0 18px}
.secs{display:grid;gap:10px}
.secs button{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;background:none;border:0;border-top:1px solid var(--rule);padding:10px 0 0;text-align:left;cursor:pointer}
.secs b{font-family:var(--f-mono);font-weight:500;color:var(--wc)}
.secs span{font-family:var(--f-display);font-size:18px}
.secs small{color:var(--muted);font-size:13px}
.secs button:hover span{color:var(--wc)}

/* experiment page */
.exp .num{font-family:var(--f-mono);font-size:13px;color:var(--wc);letter-spacing:.06em}
.exp h2{font-size:clamp(26px,3.2vw,34px);line-height:1.25;margin:4px 0 6px}
.exp .src{font-size:13.5px;color:var(--muted);margin-bottom:16px}
.exp .lede{margin:0 0 18px}
.formula{border-left:3px solid var(--wc);background:var(--paper-2);padding:10px 14px;margin:0 0 18px;font-family:var(--f-mono);font-size:16px;overflow-x:auto}
.formula small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.exp h3{font-size:16px;margin-bottom:6px;color:var(--wc)}
.steps{margin:0 0 18px;padding-left:1.5em;font-size:14.5px;line-height:1.7}
.steps li.todo{color:var(--muted)}
.steps li.todo::after{content:"（建置中）";font-size:12px;color:var(--w-lens)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tag{font-size:12px;border:1px solid var(--rule);border-radius:4px;padding:0 7px;color:var(--muted)}
.tag.warn{border-color:var(--w-lens);color:var(--w-lens)}
.cta{border:0;cursor:pointer;margin-top:auto;align-self:flex-start;display:inline-flex;gap:8px;align-items:center;background:var(--ink);color:var(--paper);text-decoration:none;border-radius:6px;padding:10px 16px;font-family:var(--f-display);font-size:16px}
.cta-note{font-size:12px;color:var(--muted);margin:8px 0 0}
.cta-note a{color:var(--accent)}
/* lab overlay */
.lab{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--desk)}
.lab-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--paper);border-bottom:3px solid var(--wc);padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lab-back{border:1px solid var(--rule);background:var(--paper-2);border-radius:999px;padding:6px 14px;cursor:pointer;font-family:var(--f-display)}
.lab-name{display:flex;gap:10px;align-items:baseline;min-width:0}
.lab-name span{font-family:var(--f-mono);font-size:12px;color:var(--wc)}
.lab-name b{font-family:var(--f-display);font-size:18px}
.lab iframe{flex:1;width:100%;border:0;background:#fff;padding-bottom:env(safe-area-inset-bottom,0px)}
html.lab-open,html.lab-open body{overflow:hidden}

/* back cover */
.back{justify-content:center;gap:14px}
.back h2{font-size:26px}
.back p{margin:0;color:var(--muted);max-width:30em}

/* controls */
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.nav{display:flex;gap:8px}
.nav button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:8px 16px;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.where{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.where button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:10px}

@media (max-width:820px){
  .page{padding:30px 22px 52px;min-height:560px}
  .left .folio,.right .folio{left:50%;right:auto;transform:translateX(-50%)}
  .book{min-height:0}
}
</style>

</head>
<body>
<div class="wrap">
  <div class="book" id="book" aria-live="polite"></div>
  <div class="controls">
    <div class="where" id="where"></div>
    <div class="nav">
      <button type="button" id="installBtn" class="install" hidden>⬇ 安裝 App</button>
      <button type="button" id="prev" aria-label="上一頁">← 上一頁</button>
      <button type="button" id="next" aria-label="下一頁">下一頁 →</button>
    </div>
  </div>
  <p class="ios-tip" id="iosTip" hidden>iPhone / iPad：按 Safari 下方的「分享」→「加入主畫面」，就能像 App 一樣使用。</p>
</div>

<section class="lab" id="lab" hidden aria-label="虛擬實驗室">
  <header class="lab-bar">
    <button type="button" id="labClose" class="lab-back">← 回到書頁</button>
    <div class="lab-name"><span id="labNum"></span><b id="labTitle"></b></div>
  </header>
  <iframe id="labFrame" title="虛擬實驗室" src="about:blank"></iframe>
</section>

<script>

const OPTICS_EXP=[
  {w:"refr",t:"折射率的測定",slug:"折射率的測定",lab:"refr-106tc",src:"106 學年度 臺中區",d:"凸透鏡成像後放入透明待測物，成像點往後移，由像距變化反推待測物折射率。",f:["近軸折射後的會聚距離","s₂ = n · s₁"],tabs:["原理動畫","虛擬實驗室"]},

      }
      return `<li class="wip"><span class="ch">${chTitle(c)}</span><span class="lead"></span><a class="pg" href="${encodeURI(SITE+c.path)}" target="_blank" rel="noopener">撰寫中・看原站 ↗</a></li>`;
    }).join("");
    d.innerHTML=runhead("實驗培訓","目錄")+`<h2>目錄</h2><ol>${rows}</ol>`+folio;
  }else if(p.kind==="opener"){
    const c=p.c;
    d.classList.add("opener");
    let items;
    if(c.sections){
      items=c.sections.map(s=>{const n=c.exps.filter(e=>e.w===s.id).length;return `<button type="button" data-go="${s.page}" style="--wc:${s.color}"><b>${s.no}</b><span>${s.name}</span><small>${n} 個實驗・p.${s.page}</small></button>`;}).join("");
    }else{
      items=c.exps.map((e,k)=>`<button type="button" data-go="${e.page}" style="--wc:${c.color}"><b>${c.num}-${k+1}</b><span>${esc(e.t)}</span><small>p.${e.page}</small></button>`).join("");
    }
    d.innerHTML=runhead("實驗培訓",`第${c.no}章`)+`
      <div class="chno">第${c.no}章</div><h2>${c.name}</h2>
      ${ART[c.art]||""}
      <p>${c.intro}</p>
      <div class="secs">${items}</div>`+folio;
  }else if(p.kind==="exp"){
    const {c,e,s}=p;
    d.classList.add("exp");d.style.setProperty("--wc",s.color);
    const steps=e.tabs.map((t,k)=>`<li${e.todo&&e.todo.includes(k)?' class="todo"':""}>${esc(t)}</li>`).join("");
    const tags=[`<span class="tag">${e.tabs.length} 個步驟</span>`];
    if(e.rnd)tags.push(`<span class="tag">每次隨機待測值</span>`);
    if(e.todo)tags.push(`<span class="tag warn">部分建置中</span>`);
    const page=encodeURI(SITE+c.path+e.slug);
    const cta=e.lab
      ?`<button class="cta" type="button" data-lab="${i}">▶ 在書中開啟實驗室</button>
      <p class="cta-note">原題與補充資料在<a href="${page}" target="_blank" rel="noopener">協作平台原頁面 ↗</a>（請用學校帳號登入）。</p>`
      :`<a class="cta" href="${page}" target="_blank" rel="noopener">到協作平台看這個實驗 ↗</a>
      <p class="cta-note">這個實驗還沒有虛擬實驗室，請用學校帳號登入原站。</p>`;
    d.innerHTML=runhead(chTitle(c),s.no?`${s.no}　${s.name}`:"")+`
      <div class="num">實驗 ${c.num}-${p.n}</div>
      <h2>${esc(e.t)}</h2>
      <div class="src">${esc(e.srcText||(e.src+" 物理實驗試題改編"))}</div>
      <p class="lede">${esc(e.d)}</p>
      ${e.f?`<div class="formula"><small>${esc(e.f[0])}</small>${esc(e.f[1])}</div>`:""}
      <h3>實驗流程</h3>
      <ol class="steps">${steps}</ol>
      <div class="tags">${tags.join("")}</div>
      ${cta}`+folio;
  }else if(p.kind==="back"){
    const left=CHAPTERS.filter(c=>!c.ready).length;
    d.classList.add("back");
    d.innerHTML=`<h2>${left?"目前的內容到這裡":"全書完"}</h2>
      ${left?`<p>還有 ${left} 章撰寫中，內容目前仍放在學校協作平台。</p>`:""}
      <p><a href="${SITE}" target="_blank" rel="noopener" style="color:var(--accent)">前往實驗培訓原站 ↗</a></p>
      <p><button class="linkbtn" type="button" data-go="1" style="color:var(--accent);text-decoration:underline">回到目錄</button></p>`+folio;
  }
  return d;
}

/* ---------- book engine ---------- */
const book=document.getElementById("book");
const mq=window.matchMedia("(max-width: 820px)");
let cur=0;
function spreadStart(i){return i===0?0:(i%2===1?i:i-1);}
function show(i,dir){
  i=Math.max(0,Math.min(PAGES.length-1,i));
  cur=i;
  book.innerHTML="";
  book.className="book"+(dir?(dir>0?" turn-next":" turn-prev"):"");
  const single=mq.matches;
  if(single){
    book.classList.add("single");
    book.appendChild(renderPage(i));
  }else if(i===0){
    const blurb=document.createElement("article");blurb.className="page left cover-blurb";
    blurb.innerHTML=`<h2>給參加物理實驗競賽的同學</h2><p>這本書整理歷屆學科能力競賽的物理實驗題，每題都做成可以動手操作的虛擬實驗室：調器材、讀數據、作迴歸、算誤差。</p><p>按右下角「下一頁」或鍵盤方向鍵翻頁，也可以從目錄直接跳到想練的實驗。</p>`;
    const c=renderPage(0);c.classList.add("right");
    book.append(blurb,c);
  }else{
    const L=spreadStart(i);
    const l=renderPage(L);l.classList.add("left");
    let r;
    if(L+1<PAGES.length){r=renderPage(L+1);}else{r=document.createElement("article");r.className="page blank";}
    r.classList.add("right");
    book.append(l,r);
  }
  book.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.go)));
  book.querySelectorAll("[data-lab]").forEach(b=>b.addEventListener("click",()=>openLab(PAGES[+b.dataset.lab])));
  updateControls();
  try{history.replaceState(null,"",i?("#p"+i):"#cover");}catch(e){location.hash=i?("p"+i):"cover";}
}
function step(){return mq.matches?1:2;}
function next(){
  if(mq.matches) return go(cur+1);
  const L=spreadStart(cur); go(cur===0?1:L+2);
}
function prev(){
  if(mq.matches) return go(cur-1);
  const L=spreadStart(cur); go(L<=1?0:L-2);
}
function go(i){const dir=i>cur?1:-1;show(i,i===cur?0:dir);book.scrollIntoView({block:"start",behavior:"auto"});}
function updateControls(){
  const single=mq.matches, last=PAGES.length-1;
  const L=spreadStart(cur);
  document.getElementById("prev").disabled=cur===0;
  document.getElementById("next").disabled=single?cur>=last:(cur!==0&&L+1>=last);
  const w=document.getElementById("where");
  let label;
  if(cur===0)label="封面";
  else if(single)label=`第 ${cur} 頁／共 ${last} 頁`;
  else label=`第 ${L}–${Math.min(L+1,last)} 頁／共 ${last} 頁`;
  w.innerHTML=`<span>${label}</span>`;
  if(cur>1){const b=document.createElement("button");b.type="button";b.textContent="回目錄";b.onclick=()=>go(1);w.appendChild(b);}
}
const labEl=document.getElementById("lab"), labFrame=document.getElementById("labFrame");
let labOpener=null;
function openLab(p){
  labOpener=document.activeElement;
  document.getElementById("labNum").textContent="實驗 "+p.c.num+"-"+p.n;
  document.getElementById("labTitle").textContent=p.e.t;
  labEl.style.setProperty("--wc",p.s.color);
  labFrame.src="labs/"+p.e.lab+".html";
  labEl.hidden=false;document.documentElement.classList.add("lab-open");
  document.getElementById("labClose").focus();
}
function closeLab(){
  labEl.hidden=true;labFrame.src="about:blank";document.documentElement.classList.remove("lab-open");
  if(labOpener&&labOpener.focus)labOpener.focus();
}
document.getElementById("labClose").onclick=closeLab;
document.getElementById("next").onclick=next;
document.getElementById("prev").onclick=prev;
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,textarea"))return;
  if(!labEl.hidden){if(e.key==="Escape")closeLab();return;}
  if(e.key==="ArrowRight")next(); else if(e.key==="ArrowLeft")prev();
});
let tx=null;
book.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;},{passive:true});
book.addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)(dx<0?next:prev)();tx=null;});
mq.addEventListener?mq.addEventListener("change",()=>show(cur,0)):mq.addListener(()=>show(cur,0));

function fromHash(){const m=/^#p(\d+)$/.exec(location.hash);return m?+m[1]:0;}
window.addEventListener("hashchange",()=>{const i=fromHash();if(i!==cur)show(i,0);});
show(fromHash(),0);
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
let deferredPrompt=null;
const ib=document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;ib.hidden=false;});
ib.addEventListener("click",async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;ib.hidden=true;});
window.addEventListener("appinstalled",()=>{ib.hidden=true;});
const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone)document.getElementById("iosTip").hidden=false;
</script>
